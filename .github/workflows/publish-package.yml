name: Publish Package

# Publishes @gurukulams/practice-js to GitHub Packages (npm.pkg.github.com).
# Never publishes to the public npm registry — package.json#publishConfig.registry
# pins the target regardless of whatever default registry is configured.
#
# To cut a release:
#   npm version patch    # or minor / major — writes package.json + creates the tag
#   git push && git push --tags

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@gurukulams'

    - name: Verify tag matches package.json version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PKG_VERSION="$(node -p "require('./package.json').version")"
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}."
          echo "::error::Use 'npm version <patch|minor|major>' so both stay in sync."
          exit 1
        fi
        echo "Publishing version ${PKG_VERSION}"

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Run Playwright tests
      run: |
        npx playwright install --with-deps chromium
        npx playwright test

    - name: Publish to GitHub Packages
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
