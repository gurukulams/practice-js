<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practice.js Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom px-3 py-2">
      <a class="navbar-brand fw-semibold" href="#"><span data-i18n="appTitle">Practice.js Playground</span></a>

      <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarControls" aria-controls="navbarControls" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarControls">
        <div class="navbar-nav ms-auto d-flex flex-row flex-wrap align-items-center gap-2 mt-2 mt-md-0">

          <!-- Language select -->
          <select class="form-select form-select-sm" id="langSelect" style="width:60px">
            <option value="en" selected>EN</option>
            <option value="ta">த</option>
          </select>

          <!-- Options button — opens offcanvas -->
          <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#optionsModal">
            <i class="bi bi-sliders me-1"></i><span data-i18n="options">Options</span>
          </button>

          <!-- Mode select -->
          <div class="d-flex align-items-center gap-1">
            <label class="form-label mb-0 text-nowrap small fw-semibold" for="modeSelect" data-i18n="modeLabel">Mode</label>
            <select class="form-select form-select-sm" id="modeSelect" style="min-width:110px">
              <option value="PRACTICE" selected>PRACTICE</option>
              <option value="QUIZ">QUIZ</option>
              <option value="EDIT">EDIT</option>
            </select>
          </div>

        </div>
      </div>
    </nav>

    <!-- Options Modal -->
    <div class="modal fade" tabindex="-1" id="optionsModal" aria-labelledby="optionsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="optionsModalLabel">
              <i class="bi bi-sliders me-2"></i><span data-i18n="options">Options</span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body d-flex flex-column gap-3">

            <!-- Practice settings — visible only in PRACTICE mode -->
            <div id="practiceSettingsSection" class="d-none">
              <h6 class="fw-semibold mb-3"><i class="bi bi-list-ol me-2"></i>Scope</h6>
              <div style="max-width:160px">
                <label class="form-label fw-semibold small" for="practiceMaxQInput">Questions to show <span class="text-muted fw-normal" id="practiceMaxQHint"></span></label>
                <input type="number" class="form-control form-control-sm" id="practiceMaxQInput" min="1">
              </div>
              <div style="max-width:160px">
                <label class="form-label fw-semibold small" for="complexityCmb">Complexity<span class="text-muted fw-normal" id="practiceMaxQHint"></span></label>
                <select id="complexityCmb" class="form-select" aria-label="Default select example">
                  <option value="">Low</option>
                  <option value="M">Medium</option>
                  <option value="H">High</option>
                </select>
              </div>
            </div>

            <!-- Quiz settings — visible only in QUIZ mode -->
            <div id="quizSettingsSection" class="d-none">
              <h6 class="fw-semibold mb-3"><i class="bi bi-stopwatch me-2"></i>Quiz Settings</h6>
              <div class="row g-3">
                <div class="col-6">
                  <label class="form-label fw-semibold small" for="timerInput"><i class="bi bi-stopwatch me-1"></i>Duration (seconds)</label>
                  <input type="number" class="form-control form-control-sm" id="timerInput" placeholder="no timer" min="1">
                </div>
                <div class="col-6">
                  <label class="form-label fw-semibold small" for="maxQInput">Max Questions <span class="text-muted fw-normal" id="quizMaxQHint"></span></label>
                  <input type="number" class="form-control form-control-sm" id="maxQInput" placeholder="all" min="1">
                </div>
              </div>
            </div>

            <!-- JSON editor — visible only in EDIT mode -->
            <div id="jsonEditorSection" class="d-none">
              <p class="text-muted small mb-0">Edit the JSON below and click <strong>Load</strong> to apply changes. This updates the current session only.</p>
              <textarea class="form-control font-monospace" id="questionsJsonArea" rows="15" spellcheck="false" style="resize:vertical;min-height:200px"></textarea>
              <div id="jsonErrorMsg" class="text-danger small d-none"></div>
            </div>

          </div>
          <div class="modal-footer">
            <div id="jsonBtns" class="d-none d-flex gap-2 me-auto">
              <button type="button" class="btn btn-outline-secondary btn-sm" id="resetJsonBtn">
                <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
              </button>
              <button type="button" class="btn btn-primary btn-sm" id="loadJsonBtn">
                <i class="bi bi-upload me-1"></i>Load
              </button>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary btn-sm" id="optionsApplyBtn">
              <i class="bi bi-arrow-clockwise me-1"></i>Apply
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Alert area -->
    <div id="alertArea" class="px-3 mt-2"></div>

    <!-- Main mount point -->
    <div id="practice-main" class="px-3 mt-2"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script type="module" src="practice.bundle.js"></script>
    <script type="module" src="q-loader.esm.js"></script>
    <script type="module">
      
      import {QuestionLoader} from './q-loader.esm.js';
      
      // ── Helpers ──────────────────────────────────────────────────────────────

      function showAlert(message, type) {
        var t = type || 'danger';
        var area = document.getElementById('alertArea');
        var wrapper = document.createElement('div');
        wrapper.innerHTML = [
          '<div class="alert alert-' + t + ' alert-dismissible" role="alert">',
          '  <div>' + message + '</div>',
          '  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
          '</div>'
        ].join('');
        area.innerHTML = '';
        area.append(wrapper);
      }

      // ── State ─────────────────────────────────────────────────────────────────

      var currentQuestions = [];
      var currentMode = 'PRACTICE';
      var currentLocale = 'en';

      // ── Page-level i18n ───────────────────────────────────────────────────────

      var pageStrings = {
        en: {
          appTitle: 'Practice.js Playground',
          options: 'Options',
          modeLabel: 'Mode',
          timerLabel: 'Timer (s)',
          maxQLabel: 'Max Q',
          applyBtn: 'Apply',
          timerRadio: 'Timer',
          maxQRadio: 'Max Q',
          questionsJson: 'Questions JSON',
          jsonDesc: 'Edit the JSON below and click <strong>Load</strong> to apply changes. This updates the current session only.',
          resetBtn: 'Reset',
          loadBtn: 'Load',
          loadSuccess: 'Questions loaded successfully.',
          loadFail: 'Failed to load questions: ',
        },
        ta: {
          appTitle: 'Practice.js விளையாட்டரங்கு',
          options: 'விருப்பங்கள்',
          modeLabel: 'முறை',
          timerLabel: 'நேரம் (வி)',
          maxQLabel: 'அதிக கே',
          applyBtn: 'பயன்படுத்து',
          timerRadio: 'நேரம்',
          maxQRadio: 'அதிக கே',
          questionsJson: 'கேள்விகள் JSON',
          jsonDesc: 'கீழே உள்ள JSON-ஐ திருத்தி <strong>ஏற்று</strong> என்பதை கிளிக் செய்யவும்.',
          resetBtn: 'மீட்டமை',
          loadBtn: 'ஏற்று',
          loadSuccess: 'கேள்விகள் வெற்றிகரமாக ஏற்றப்பட்டன.',
          loadFail: 'கேள்விகளை ஏற்ற தோல்வி: ',
        }
      };

      function applyPageLocale(locale) {
        var s = pageStrings[locale] || pageStrings.en;
        document.querySelectorAll('[data-i18n="appTitle"]').forEach(function(el) { el.textContent = s.appTitle; });
        document.querySelectorAll('[data-i18n="options"]').forEach(function(el) { el.textContent = s.options; });
        document.querySelector('[data-i18n="modeLabel"]').textContent = s.modeLabel;
        document.querySelector('label[for="maxQInput"]').textContent = s.maxQLabel;
        document.querySelector('label[for="optTimer"]').textContent = s.timerRadio;
        document.querySelector('label[for="optMaxQ"]').textContent = s.maxQRadio;
        var jsonDescEl = document.querySelector('#jsonEditorSection p.text-muted');
        if (jsonDescEl) jsonDescEl.innerHTML = s.jsonDesc;
        document.getElementById('resetJsonBtn').innerHTML = '<i class="bi bi-arrow-counterclockwise me-1"></i>' + s.resetBtn;
        document.getElementById('loadJsonBtn').innerHTML = '<i class="bi bi-upload me-1"></i>' + s.loadBtn;
      }

      // ── Build a fresh PracticeMaker ────────────────────────────────────────

      function buildInstance(questions, mode, timer, maxQ, complexity) {
        var root = document.getElementById('practice-main');

        // destroy previous instance to clear any running timers
        if (window.__prakticeMaker && window.__prakticeMaker.destroy) {
          window.__prakticeMaker.destroy();
        }

        root.innerHTML = '';

        var qs = mode === 'EDIT'
          ? questions.filter(function(q) { return q._source === 'user'; })
          : (maxQ && maxQ > 0 && maxQ < questions.length)
            ? questions.slice(0, maxQ)
            : questions;

        var opts = {
          mode: mode,
          complexity: complexity,
          locale: currentLocale,
          error: function(msg) { showAlert(msg, 'danger'); }
        };

        if (mode === 'QUIZ' && timer && timer > 0) {
          opts.timer = timer;
        }

        var pm = new PracticeMaker.default(root, opts);

        if (mode === 'EDIT') {
          pm.setEditable(true);
        } else {
          pm.setEditable(false);
        }

        pm.setQuestions(qs);

        window.__prakticeMaker = pm;
        return pm;
      }

      // ── Mode helpers ───────────────────────────────────────────────────────

      function applyMode() {
        currentMode = document.getElementById('modeSelect').value;
        var timer = 0, maxQ = null, complexity = null;

        if(document.getElementById("complexityCmb").value.trim() !== "") {
          complexity = document.getElementById("complexityCmb").value;
        }

        if (currentMode === 'PRACTICE') {
          var raw = parseInt(document.getElementById('practiceMaxQInput').value);
          if (!isNaN(raw) && raw > 0 && raw < currentQuestions.length) maxQ = raw;
        }

        if (currentMode === 'QUIZ') {
          var timerRaw = parseInt(document.getElementById('timerInput').value);
          timer = (!isNaN(timerRaw) && timerRaw > 0) ? timerRaw : 0;
          var maxQRaw = parseInt(document.getElementById('maxQInput').value);
          maxQ = (!isNaN(maxQRaw) && maxQRaw > 0) ? maxQRaw : null;
        }

        buildInstance(currentQuestions, currentMode, timer, maxQ, complexity);
      }

      function syncQuizSection() {
        var mode   = document.getElementById('modeSelect').value;
        var isQuiz     = mode === 'QUIZ';
        var isEdit     = mode === 'EDIT';
        var isPractice = mode === 'PRACTICE';
        document.getElementById('practiceSettingsSection').classList.toggle('d-none', !isPractice);
        document.getElementById('quizSettingsSection').classList.toggle('d-none', !isQuiz);
        document.getElementById('jsonEditorSection').classList.toggle('d-none', !isEdit);
        document.getElementById('jsonBtns').classList.toggle('d-none', !isEdit);
        // update max hint
        if (isPractice) {
          var inp = document.getElementById('practiceMaxQInput');
          inp.max = currentQuestions.length;
          inp.placeholder = 'all (' + currentQuestions.length + ')';
          document.getElementById('practiceMaxQHint').textContent = '(max ' + currentQuestions.length + ')';
        }
        if (isQuiz) {
          var qInp = document.getElementById('maxQInput');
          qInp.max = currentQuestions.length;
          qInp.placeholder = 'all (' + currentQuestions.length + ')';
          var hint = document.getElementById('quizMaxQHint');
          if (hint) hint.textContent = '(max ' + currentQuestions.length + ')';
        }
      }

      // ── Options modal ──────────────────────────────────────────────────────

      var modalEl      = document.getElementById('optionsModal');
      var jsonArea     = document.getElementById('questionsJsonArea');
      var jsonErrorMsg = document.getElementById('jsonErrorMsg');

      modalEl.addEventListener('show.bs.modal', function() {
        jsonArea.value = JSON.stringify(currentQuestions, null, 2);
        jsonErrorMsg.classList.add('d-none');
        jsonErrorMsg.textContent = '';
        syncQuizSection();
      });

      document.getElementById('loadJsonBtn').addEventListener('click', function() {
        jsonErrorMsg.classList.add('d-none');
        var parsed;
        try {
          parsed = JSON.parse(jsonArea.value);
          if (!Array.isArray(parsed)) throw new Error('Root value must be a JSON array.');
        } catch (e) {
          jsonErrorMsg.textContent = 'JSON error: ' + e.message;
          jsonErrorMsg.classList.remove('d-none');
          return;
        }
        currentQuestions = parsed;
        currentMode = document.getElementById('modeSelect').value;
        applyMode();
        bootstrap.Modal.getInstance(modalEl).hide();
        showAlert((pageStrings[currentLocale] || pageStrings.en).loadSuccess, 'success');
      });

      document.getElementById('resetJsonBtn').addEventListener('click', function() {
        jsonArea.value = JSON.stringify(currentQuestions, null, 2);
        jsonErrorMsg.classList.add('d-none');
      });

      document.getElementById('optionsApplyBtn').addEventListener('click', function() {
        var mode = document.getElementById('modeSelect').value;
        if (mode === 'QUIZ') {
          var timerVal = document.getElementById('timerInput').value;
          var maxQVal  = document.getElementById('maxQInput').value;
          var timerNum = parseInt(timerVal);
          var maxQNum  = parseInt(maxQVal);
          if (timerVal !== '' && (!Number.isInteger(timerNum) || timerNum <= 0)) {
            showAlert('Timer must be at least 1 second.', 'danger'); return;
          }
          if (maxQVal !== '' && (!Number.isInteger(maxQNum) || maxQNum <= 0)) {
            showAlert('Max Questions must be at least 1.', 'danger'); return;
          }
        }
        if (mode === 'PRACTICE') {
          var pVal = document.getElementById('practiceMaxQInput').value;
          var pNum = parseInt(pVal);
          if (pVal !== '' && (!Number.isInteger(pNum) || pNum <= 0)) {
            showAlert('Questions to show must be at least 1.', 'danger'); return;
          }
        }
        bootstrap.Modal.getInstance(modalEl).hide();
        applyMode();
      });

      // ── Wire up navbar controls ────────────────────────────────────────────

      document.getElementById('modeSelect').addEventListener('change', function() {
        syncQuizSection();
        currentMode = document.getElementById('modeSelect').value;
        applyMode();
      });

      // Language toggle
      document.getElementById('langSelect').addEventListener('change', function() {
        currentLocale = this.value;
        applyPageLocale(currentLocale);
        applyMode();
      });

      // ── Bootstrap ─────────────────────────────────────────────────────────

      async function init() {
        // Read URL params so tests (and direct links) can pre-configure mode/timer/editable
        var params = new URLSearchParams(window.location.search);
        var paramMode     = params.get('mode');
        var paramTimer    = parseInt(params.get('timer')) || 0;
        var paramEditable = params.get('editable');

        if (paramMode && ['PRACTICE', 'QUIZ', 'EDIT'].includes(paramMode)) {
          currentMode = paramMode;
          document.getElementById('modeSelect').value = paramMode;
          syncQuizSection();
        }

        if (paramTimer > 0) {
          document.getElementById('timerInput').value = paramTimer;
        }

        try {
          const loader = new QuestionLoader();
          loader.repoUrl = "http://localhost:3000/data/com/example";
          const externalQuestions = await loader.loadQuestions();
          
          var userQuestions = (function() {
            try { return JSON.parse(localStorage.getItem('practiceJs_userQuestions')) || []; }
            catch(e) { return []; }
          })();

          const   assignIds = (questions, baseId) => {
            return questions.map((q, qIndex) => {
              const questionId = `${baseId}-q${qIndex}`;
              const choices = (q.choices || []).map((c, i) => ({
                ...c,
                id: `${questionId}-c${i}`,
                questionId,
              }));
              const matches = (q.matches || []).map((m, i) => ({
                ...m,
                id: `${questionId}-m${i}`,
                questionId,
              }));
              return {
                ...q,
                id: questionId,
                choices: choices,
                matches: matches,
              };
            });
          }

          currentQuestions = assignIds(externalQuestions.concat(userQuestions),"");


          

          document.getElementById('maxQInput').placeholder = currentQuestions.length;
        } catch (e) {
          showAlert((pageStrings[currentLocale] || pageStrings.en).loadFail + e.message, 'danger');
          currentQuestions = [];
        }

        syncQuizSection();
        var pm = buildInstance(currentQuestions, currentMode, paramTimer, null, null);

        // Apply editable param after instance is built (buildInstance already handles EDIT mode,
        // but an explicit ?editable=1 should also enable edit badge in PRACTICE/QUIZ modes)
        if (paramEditable === '1') {
          pm.setEditable(true);
        }
      }

      init();
    </script>
  </body>
</html>
