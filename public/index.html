<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practice.js Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom px-3 py-2">
      <a class="navbar-brand fw-semibold" href="#"><span data-i18n="appTitle">Practice.js Playground</span></a>

      <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarControls" aria-controls="navbarControls" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarControls">
        <div class="navbar-nav ms-auto d-flex flex-row flex-wrap align-items-center gap-2 mt-2 mt-md-0">
<!-- Added Text Box -->
<input type="text" class="form-select-sm form-control form-control-sm" id="qPathInput" placeholder="Question Path" value="" list="qPathList" style="width: 450px;">
<datalist id="qPathList"></datalist>   
<!-- Language select -->
          <select class="form-select form-select-sm" id="langSelect" style="width:60px">
            <option value="en" selected>EN</option>
            <option value="ta">த</option>
          </select>

          <!-- Options button — opens offcanvas -->
          <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#optionsModal">
            <i class="bi bi-sliders me-1"></i><span data-i18n="options">Options</span>
          </button>

          <!-- Mode select -->
          <div class="d-flex align-items-center gap-1">
            <label class="form-label mb-0 text-nowrap small fw-semibold" for="modeSelect" data-i18n="modeLabel">Mode</label>
            <select class="form-select form-select-sm" id="modeSelect" style="min-width:110px">
              <option value="PRACTICE" selected>PRACTICE</option>
              <option value="QUIZ">QUIZ</option>
              <option value="EDIT">EDIT</option>
            </select>
          </div>

        </div>
      </div>
    </nav>

    <div class="modal fade" tabindex="-1" id="optionsModal" aria-labelledby="optionsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="optionsModalLabel">
              <i class="bi bi-sliders me-2"></i><span data-i18n="options">Options</span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body d-flex flex-column gap-3">
            <label class="form-label mb-0 text-nowrap small fw-semibold" for="complexityCmb" data-i18n="modeLabel">Complexity
            </label>
            <select id="complexityCmb" class="form-select form-select-sm" aria-label="Default select example"><option value="">Low</option><option value="M">Medium</option><option value="H">High</option></select></div><div class="form-check mb-3"><label class="form-label fw-semibold small" for="maxQInput">Max Questions <span class="text-muted fw-normal" id="quizMaxQHint"></span></label>
            <input type="number" class="form-control form-control-sm" id="maxQInput" placeholder="all" min="1"></div><div class="form-check mb-3"><label class="form-label fw-semibold small" for="timerInput"><i class="bi bi-stopwatch me-1"></i>Quiz Duration (seconds)</label>
            <input type="number" class="form-control form-control-sm" id="timerInput" placeholder="no timer" min="1">            
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary btn-sm" id="optionsApplyBtn">
              <i class="bi bi-arrow-clockwise me-1"></i>Apply
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Alert area -->
    <div id="alertArea" class="px-3 mt-2"></div>

    <!-- Main mount point -->
    <div id="practice-main" class="px-3 mt-2"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script type="module" src="practice.bundle.js"></script>

    <script type="module">
      import PlaygroundApp from './js/PlaygroundApp.js';
  
      document.addEventListener('DOMContentLoaded', () => {
          const app = new PlaygroundApp();
          app.init();
      });
  </script>
  </body>
</html>
